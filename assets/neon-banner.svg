<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Neon grid</title>
  <desc id="desc">Turkuaz ve mor neon ışıklar içeren koyu cyberpunk ızgara.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070914"/><stop offset=".55" stop-color="#11102a"/><stop offset="1" stop-color="#071b25"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3cac"/><stop offset=".5" stop-color="#784ba0"/><stop offset="1" stop-color="#00f5ff"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="skewY(-18)">
      <path d="M48 0H0V48" fill="none" stroke="#00f5ff" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#grid)"/>
  <path d="M0 245 Q250 175 490 235 T940 210 T1200 230" fill="none" stroke="url(#glow)" stroke-width="18" opacity=".45" filter="url(#blur)"/>
  <path d="M0 245 Q250 175 490 235 T940 210 T1200 230" fill="none" stroke="url(#glow)" stroke-width="2" opacity=".8"/>
  <circle cx="100" cy="70" r="2" fill="#00f5ff"/><circle cx="1070" cy="82" r="2" fill="#ff3cac"/>
  <circle cx="980" cy="255" r="2" fill="#00f5ff"/><circle cx="220" cy="210" r="2" fill="#ff3cac"/>
</svg>
